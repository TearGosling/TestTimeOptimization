dataset:
  name: "codelion/fineweb-edu-1B"
  max_seq_length: 512
model:
  type: "titans"
  vocab_size: 32000
  hidden_size: 768
  intermediate_size: 2048
  num_attention_heads: 12
  num_hidden_layers: 12
  hidden_act: "silu"
  variant: "lmm"
  memory_chunk_size: 8
  memory_num_heads: 12
  memory_head_dim: 64
  memory_num_layers: 2
  memory_mlp_expansion: 4
  persistent_memory_tokens: 4
tokenizer: "NousResearch/Llama-2-7b-hf"
training_args:
  device: "cuda"
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  learning_rate: 0.0003
  logging_steps: 1
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  per_device_train_batch_size: 4
  project: "tto-training"
  output_dir: "./checkpoints/titans_lmm_120m"
  num_train_epochs: 1
  report_to: "wandb"
  resume_from_checkpoint: null
  save_steps: 1000
  save_total_limit: 3
  seed: 80085
  warmup_steps: 2000
  torch_compile: false
  weight_decay: 0.1
